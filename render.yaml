services:
  - type: web
    name: openroadmap-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION
        value: educational_resources
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT
        value: 5/minute
      - key: ROADMAP_MODEL
        value: gpt-4o-mini
